image: python:3.13

stages:
 - build
 - test

# For debugging
before_script:
  - python --version
  - pip --version  
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt

build:
  stage: build
  script:
    - python -m compileall . 

unit_test:
  stage: test
  script:
    - export PYTHONPATH=$PYTHONPATH:$CI_PROJECT_DIR
    - pytest -v
