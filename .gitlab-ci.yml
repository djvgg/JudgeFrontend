image: python:3.13

stages:
  - lint
  - build
  - test

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install ruff

lint:
  stage: lint
  script:
    - echo "Running ruff linter..."
    - ruff check backend/ main.py scripts/ migrations/
    - echo "Code quality check passed"
  allow_failure: false

build:
    stage: build
    script:
      - echo "Checking Python syntax..."
      - python -m compileall backend/ main.py scripts/ migrations/
      - echo "Syntax check passed"

test:
  stage: test
  script:
    - echo "Running import smoke tests..."
    - python -c "from backend.bracket_data import ageGroups, getNextPowerOf2; print('bracketData OK')"
    - python -c "from backend.xlsx_handler import processXlsx; print('xlsxHandler OK')"
    - python -c "from backend.excel_generator import generateBracketsForGroups; print('excelGenerator OK')"
    - echo "All modules import successfully"

integration_test:
  stage: test
  script:
    - echo "Running basic integration test..."
    - python -c "from backend.bracket_data import getNextPowerOf2; result = getNextPowerOf2(17); assert result == 32; print('Bracket logic OK')"
    - echo "Integration test passed"
