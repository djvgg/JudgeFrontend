image: python:3.13

stages:
  - lint
  - build
  - test
  - docs

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install ruff
  - apt-get update -y
  - apt-get install -y doxygen

lint:
  stage: lint
  script:
    - echo "Running ruff linter..."
    - ruff check src/ main.py scripts/
    - echo "Code quality check passed"
  allow_failure: false

build:
    stage: build
    script:
      - echo "Checking Python syntax..."
      - python -m compileall src/ main.py scripts/
      - echo "Syntax check passed"

test:
  stage: test
  script:
    - echo "Running import smoke tests..."
    - python -c "from src.bracketData import ageGroups, getNextPowerOf2; print('bracketData OK')"
    - python -c "from src.xlsxHandler import processXlsx; print('xlsxHandler OK')"
    - python -c "from src.excelGenerator import generateBracketsForGroups; print('excelGenerator OK')"
    - echo "All modules import successfully"

integration_test:
  stage: test
  script:
    - echo "Running basic integration test..."
    - python -c "from src.bracketData import getNextPowerOf2; result = getNextPowerOf2(17); assert result == 32; print('Bracket logic OK')"
    - echo "Integration test passed"

build_docs:
  stage: docs
  script:
  - echo "Building Doxygen documentation..."
  - doxygen Doxyfile
  artifacts:
    paths:
      - html/
